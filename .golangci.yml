version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - depguard
    - dupl
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomodguard_v2
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - sloglint
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace
  settings:
    goconst:
      # Köppen-Geiger codes (Af … EF) are data — the keys of
      # koppenDescriptions and the expected values of the reference-station
      # tests — not magic strings; 30 named constants would only rename them.
      # goconst counts test-file occurrences too, so the station table alone
      # pushes most codes past the threshold.
      ignore-string-values:
        - '^(A[fmw]|B[SW][hk]|[CD][sfw][abcd]|E[FT])$'
    sloglint:
      # Only the trace-correlation rule: a log call with a context in scope
      # must pass it (InfoContext, ErrorContext, …), or SpanContextHandler
      # cannot attach trace_id. The style rules stay off; mixed kv/attr args
      # are allowed, as they were before.
      no-mixed-args: false
      context: scope
    depguard:
      rules:
        adapters:
          files:
            - '**/internal/adapters/**'
          # lax: everything not denied is allowed, and an allow entry more
          # specific than a deny wins. The single exception is omhttp — the
          # shared Open-Meteo HTTP plumbing (throttling transport + GetJSON)
          # every Open-Meteo adapter needs; it is transport, not a port. The
          # trailing $ makes it an exact match, so no sibling slips through.
          list-mode: lax
          allow:
            - github.com/jobrunner/tempus/internal/adapters/omhttp$
          deny:
            - pkg: github.com/jobrunner/tempus/internal/application
              desc: adapters talk to the core only through ports
            - pkg: github.com/jobrunner/tempus/internal/app
              desc: adapters do not know the composition root
            - pkg: github.com/jobrunner/tempus/internal/adapters
              desc: no adapter->adapter import; shared logic goes in domain/ports
        application:
          files:
            - '**/internal/application/**'
          deny:
            - pkg: github.com/jobrunner/tempus/internal/adapters
              desc: the core talks to adapters only through ports
            - pkg: github.com/jobrunner/tempus/internal/app
              desc: the core does not know the composition root
        domain:
          files:
            - '**/internal/domain/**'
          deny:
            - pkg: github.com/jobrunner/tempus/internal/application
              desc: domain is the innermost core and imports nothing internal
            - pkg: github.com/jobrunner/tempus/internal/ports
              desc: domain must not know ports
            - pkg: github.com/jobrunner/tempus/internal/adapters
              desc: domain must not know adapters
            - pkg: github.com/jobrunner/tempus/internal/app
              desc: domain must not know the composition root
            - pkg: github.com/jobrunner/tempus/internal/config
              desc: domain stays config-free
        ports:
          files:
            - '**/internal/ports/**'
          deny:
            - pkg: github.com/jobrunner/tempus/internal/application
              desc: ports define contracts over domain only
            - pkg: github.com/jobrunner/tempus/internal/adapters
              desc: ports must not know adapters
            - pkg: github.com/jobrunner/tempus/internal/app
            - pkg: github.com/jobrunner/tempus/internal/config
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - depguard
          - dupl
          - goconst
          - noctx
        path: _test\.go
      # sloglint is enabled for its context rule only. Its always-on
      # io.Discard→slog.DiscardHandler check is not configurable and fires on
      # test loggers only; it is style, not correlation, so it stays out here.
      - linters:
          - sloglint
        path: _test\.go
        text: use slog.DiscardHandler instead
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
