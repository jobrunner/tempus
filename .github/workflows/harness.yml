# MANDATORY. Fails when a mandatory component of the quality harness is missing
# or not wired up. This is the gate that keeps the harness from quietly eroding:
# every other gate protects the code, this one protects the gates.
#
# It builds nothing, so it can run on every push and PR. It runs in the
# flake's dev shell like every other job: the workflow-structure check parses
# YAML with yq from there.
name: Harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job EXECUTES scripts/harness-check.sh from the checked-out PR,
          # so PR-controlled code runs in the same workspace as the token. It
          # needs the files, not the credential.
          persist-credentials: false

      - uses: ./.github/actions/nix-shell

      - name: Harness completeness
        run: bash scripts/harness-check.sh
