# CodeCharta analysis — a 3D "code city" of the Go code, combining structure +
# complexity (ccsh unifiedparser), test coverage (go cover -> lcov ->
# coverageimport) and git history / churn / authors (gitlogparser). The merged
# map is uploaded as an artifact; open it at
# https://maibornwolff.github.io/codecharta/visualization/ (load tempus.cc.json.gz).
# The map is also a RATCHET: scripts/codecharta-ratchet.py gates it against
# .codecharta-ratchet.json — a per-file complexity cap and a per-function cap
# (baselines can't grow, everything else <= default_cap) plus a hotspot gate
# (complex AND under-tested files fail unless grandfathered). The job fails on a
# regression; the artifact is still uploaded (if: always()). Ratchet the
# baselines DOWN as code improves — the gate prints a notice when one can drop.
name: CodeCharta

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # The flake's dev shell (.github/actions/nix-shell), as in ci.yml.
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  codecharta:
    name: CodeCharta analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitlogparser needs full history for churn/authors/age

      # Go, node and the JRE for ccsh, gcov2lcov and python come from the dev
      # shell; the ccsh version, the excludes and the steps live in the
      # Makefile's codecharta target, so this run and a local one are the same.
      - uses: ./.github/actions/nix-shell

      - name: Map + ratchet gate (make codecharta)
        run: make codecharta

      - name: Upload map
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecharta-map
          path: tempus.cc.json.gz
          if-no-files-found: warn
