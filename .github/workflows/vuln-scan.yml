# MANDATORY. Scheduled govulncheck + Trivy image scan, opening/updating a
# security-labelled issue on findings, and an unattended fix PR for Go CVEs.
#
# The regular CI Security job runs on every push and PR; these jobs run on a
# schedule so newly-disclosed CVEs become visible even when there is no PR
# activity to trigger them.
#
# Three jobs:
#   - scan (govulncheck, daily) — Go stdlib + module CVEs reachable from the code
#   - autofix (after scan, on findings) — applies the fixed versions govulncheck
#     names (scripts/vuln-autofix.sh: Go toolchain directive + Docker builder
#     image, `go get`) and opens a `fix(deps)` PR as the release GitHub App
#     with auto-merge. The PR's CI is the proof. Unattended path for Go CVEs,
#     which Dependabot does not cover reliably.
#   - image-scan (trivy, weekly) — the PUBLISHED ghcr.io image at the newest
#     release tag (resolved at run time; there is no :latest). Catches what
#     govulncheck cannot: OS packages from the base image (openssl, curl, …)
#     and unreachable-but-flagged Go module CVEs. A released image that was
#     clean at release time rots as new CVEs are disclosed; this job is what
#     surfaces that without waiting for the next release.
#
# Outcome handling distinguishes three cases (scan and image-scan):
#   - findings (govulncheck exit 3 / trivy JSON has fixable CRITICAL..LOW)
#       → open / comment on a `security`-labelled GitHub issue, fail the job
#   - clean (exit 0)
#       → succeed silently
#   - scan error (build failed, network issue, unexpected exit)
#       → fail the job WITHOUT opening an issue, so we don't spam "new CVEs"
#         when really the scan was broken
name: Vuln Scan

on:
  schedule:
    # Daily 06:00 UTC, so a Go security release is picked up within a day.
    # Two entries only so image-scan can keep its weekly (Monday) cadence:
    # its findings need a base-image release, not a daily issue comment.
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 0,2-6'
  workflow_dispatch:

# Least privilege at the workflow level; every job adds what it needs itself.
permissions:
  contents: read

jobs:
  scan:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # to open / comment on the security issue
    outputs:
      rc: ${{ steps.vuln.outputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # govulncheck from flake.lock, not @latest: a security gate that silently
      # changes tool version between runs cannot be reasoned about. Go itself
      # follows go.mod's toolchain directive (GOTOOLCHAIN=auto), so the scan
      # sees the stdlib the build actually uses.
      - uses: ./.github/actions/nix-shell

      - name: Run govulncheck
        id: vuln
        # The flake's dev shell: govulncheck and Go as in ci.yml and locally.
        shell: nix develop --command bash -e {0}
        run: |
          # Text mode is the only mode whose exit code reports findings:
          #   0 — no vulnerabilities
          #   3 — vulnerabilities found
          #   other — scan failed (build error, network, etc.)
          # Do NOT switch back to -json: it exits 0 even with findings, which
          # kept this job green through 2026-11 while main carried 15
          # reachable CVEs.
          set +e
          govulncheck ./... > vuln-report.txt 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Ensure `security` label exists
        if: steps.vuln.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: --force overwrites if it exists, creates otherwise.
          gh label create security \
            --color D93F0B \
            --description "Security vulnerability or scan finding" \
            --force

      - name: Open or update security issue
        if: steps.vuln.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Weekly vuln scan: new CVEs detected"
          existing=$(gh issue list \
            --label security \
            --state open \
            --search "$title in:title" \
            --json number --jq '.[0].number // ""')

          body=$(printf 'govulncheck reports vulnerabilities on main.\n\n```\n%s\n```\n\n## Fix\n\nThe autofix job of this workflow opens a `fix(deps)` PR with the fixed versions (Go `toolchain` directive in `go.mod` plus the Docker builder image, `go get` for modules) and enables auto-merge. If no such PR appears, no fix is released yet, or the PR needs a human (check its CI).\n' "$(cat vuln-report.txt)")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "$title" \
              --label security \
              --body "$body"
          fi

      - name: Fail with scan-error context
        if: steps.vuln.outputs.rc != '0' && steps.vuln.outputs.rc != '3'
        env:
          RC: ${{ steps.vuln.outputs.rc }}
        run: |
          echo "::error::govulncheck exited with $RC — not a CVE finding, likely a scan error. See log for details."
          cat vuln-report.txt
          exit 1

      - name: Fail job if vulnerabilities found
        if: steps.vuln.outputs.rc == '3'
        run: exit 1

  autofix:
    name: govulncheck autofix
    needs: scan
    # Only when the scan found something (exit 3); a scan error stays a
    # failed scan job and never turns into a PR. Only on main: a manual run
    # on another branch would carry that branch's commits into the
    # auto-merging fix PR.
    if: ${{ !cancelled() && needs.scan.outputs.rc == '3' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # A manual run next to the scheduled one must not race on the PR branch.
    concurrency:
      group: vuln-autofix
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PR_BRANCH: security/govulncheck-fix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-shell

      - name: Apply fixes
        id: fix
        # The flake's dev shell: govulncheck and Go as in ci.yml and locally.
        shell: nix develop --command bash -e {0}
        run: |
          set +e
          scripts/vuln-autofix.sh "$RUNNER_TEMP/fixes.md"
          rc=$?
          set -e
          case "$rc" in
            0) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::vuln-autofix.sh failed (rc=$rc)"; exit "$rc" ;;
          esac

      # The app token, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN runs
      # no CI, so its required checks would never report.
      # Only go.mod/go.sum/Dockerfile change, so no `workflows` permission.
      - name: Mint GitHub App installation token
        id: app-token
        if: steps.fix.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          permission-contents: write      # push the fix branch
          permission-pull-requests: write # open the PR, enable auto-merge

      - name: Open or refresh the fix PR
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"

          fixes="$RUNNER_TEMP/fixes.md"
          # The Docker builder line only follows the toolchain, it is not a fix
          # of its own and does not count for the title.
          if [ "$(grep -vc '^- Docker builder' "$fixes")" -eq 1 ] && grep -q '^- Go toolchain' "$fixes"; then
            title="fix(deps): bump Go toolchain to $(sed -E 's/.* → (go[0-9.]+).*/\1/' "$fixes")"
          else
            title="fix(deps): apply govulncheck fixes"
          fi
          git checkout -b "$PR_BRANCH"
          git commit -a -m "$title" -m "Reachable vulnerabilities reported by govulncheck on main:" -m "$(cat "$fixes")"

          # Unchanged since the last run: skip the push, so the open PR's CI
          # is not restarted. The PR and auto-merge below are still
          # reconciled, in case a previous run failed after its push.
          if git fetch --quiet origin "$PR_BRANCH" 2>/dev/null \
            && git diff --quiet FETCH_HEAD HEAD; then
            echo "Fix PR branch is up to date."
          else
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${PR_BRANCH}"
          fi

          {
            echo "Automated fix, opened by \`vuln-scan.yml\` (refreshed against main on every scan while open)."
            echo
            echo "govulncheck reports reachable vulnerabilities on main. This PR applies the fixed versions it names:"
            echo
            cat "$fixes"
            echo
            echo "Auto-merge is on: the PR merges once CI is green. **If CI stays red**, the fix needs a human (e.g. an API change in the bumped module)."
          } > "$RUNNER_TEMP/pr-body.md"

          pr=$(gh pr list --repo "$REPO" --head "$PR_BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$pr" ]; then
            # REST, not `gh pr edit`: that one also queries the deprecated
            # Projects (classic) API and fails on it.
            gh api -X PATCH "repos/${REPO}/pulls/${pr##*/}" -f title="$title" \
              -F body=@"$RUNNER_TEMP/pr-body.md" --silent
          else
            pr=$(gh pr create --repo "$REPO" --base main --head "$PR_BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/pr-body.md" --label security)
          fi
          # --squash: the ruleset requires linear history.
          gh pr merge "$pr" --repo "$REPO" --auto --squash

  image-scan:
    name: trivy (published image)
    # Weekly: on the Monday schedule and on manual runs.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # to open / comment on the security issue
    env:
      # This job has no checkout, so `gh` cannot infer the repository from
      # a git remote and fails with "not a git repository". That failed the
      # job before it ever scanned (2026-11-09) — ported fix from ortus.
      GH_REPO: ${{ github.repository }}
    steps:
      # ignore-unfixed: only CVEs with an AVAILABLE FIX create an issue — those
      # are actionable via a base-image bump or `go get`. Unfixed CVEs are
      # deliberately not reported anywhere: this repo runs no per-PR Trivy SARIF
      # scan, so there is no second place they would surface. That is a
      # conscious trade (an unactionable weekly issue trains people to ignore
      # the label), not an oversight. Drop the flag if you want the full list.
      #
      # The image tag is RESOLVED, not hardcoded. docker-release.yml sets
      # `flavor: latest=false` and publishes only semver + sha tags, so there is
      # no `:latest` to scan — a hardcoded one fails every week with "unknown
      # manifest" and looks like a broken scanner rather than a missing tag.
      - name: Resolve the newest published image tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The release tag is vX.Y.Z; docker/metadata-action publishes X.Y.Z.
          tag=$(gh release view --json tagName --jq '.tagName' | sed 's/^v//')
          [ -n "$tag" ] || { echo "::error::no release found to scan"; exit 1; }
          echo "image=ghcr.io/${GITHUB_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"
          echo "Scanning ghcr.io/${GITHUB_REPOSITORY}:${tag}"

      - name: Run Trivy against ghcr.io image (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: true

      # A trivy failure (registry unreachable, DB download broken) fails the
      # step above → job fails WITHOUT opening an issue (scan error case).
      - name: Count findings
        id: findings
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Fixable CRITICAL/HIGH/MEDIUM/LOW vulnerabilities: $count"

      - name: Build human-readable report
        if: steps.findings.outputs.count != '0'
        run: |
          jq -r '
            [.Results[]? | .Target as $t | .Vulnerabilities[]?
             | {sev: .Severity, id: .VulnerabilityID, pkg: .PkgName,
                installed: .InstalledVersion, fixed: .FixedVersion, target: $t}]
            | sort_by(.sev) | .[]
            | "\(.sev)\t\(.id)\t\(.pkg) \(.installed) → \(.fixed)\t[\(.target)]"
          ' trivy-report.json > trivy-report.txt
          cat trivy-report.txt

      - name: Ensure `security` label exists
        if: steps.findings.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create security \
            --color D93F0B \
            --description "Security vulnerability or scan finding" \
            --force

      - name: Open or update security issue
        if: steps.findings.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDING_COUNT: ${{ steps.findings.outputs.count }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          set -euo pipefail
          title="Weekly image scan: new CVEs in published Docker image"
          existing=$(gh issue list \
            --label security \
            --state open \
            --search "$title in:title" \
            --json number --jq '.[0].number // ""')

          body=$(printf 'Trivy reports %s fixable CRITICAL/HIGH/MEDIUM/LOW vulnerabilities in `%s`.\n\n```\n%s\n```\n\n## Fix\n\n- OS packages: bump the base-image FROM tag so the runtime picks up patched distro packages (Dependabot'"'"'s docker ecosystem usually has a PR open already).\n- Go modules (gobinary): `go get <module>@<fixed version>`; Dependabot'"'"'s gomod ecosystem may have a PR already.\n\nEither way the fix only reaches users with the next release.\n' "$FINDING_COUNT" "$IMAGE" "$(cat trivy-report.txt)")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "$title" \
              --label security \
              --body "$body"
          fi

      - name: Fail job if vulnerabilities found
        if: steps.findings.outputs.count != '0'
        run: exit 1
