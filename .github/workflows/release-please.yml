name: Release Please

on:
  push:
    branches: [main, master]

# Least privilege at the workflow level; each job grants itself only what it
# needs. Workflow-wide write is what zizmor's excessive-permissions audit flags,
# and rightly: it hands every job in the file more than it uses.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag + release
      pull-requests: write   # maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Installation token from the release-please-fieldworksdiary GitHub App
      # (not the default GITHUB_TOKEN) so the release PR's push events
      # trigger CI — GITHUB_TOKEN-created PRs are suppressed by GitHub's
      # workflow-recursion guard, leaving required checks unreported.
      # Scope the app token to exactly what release-please does. Without a
      # permission-* input the token inherits the App's full installation
      # permissions, which is far more than this workflow needs (zizmor's
      # github-app audit).
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # cache: false on purpose. This job publishes the release artifacts, and a
      # build cache is writable by any workflow run on the repo — a poisoned
      # cache entry would end up inside a signed release. Rebuilding from
      # scratch costs a minute; the release is worth it. (zizmor cache-poisoning)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
