name: CI

on:
  push:
    branches: [main, master, feat/**, fix/**, chore/**]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          go test -coverprofile=coverage/coverage.out -covermode=atomic ./...
          go tool cover -func=coverage/coverage.out
      - name: Coverage gate
        run: ./scripts/coverage-gate.sh coverage/coverage.out

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --enable-only depguard,gomodguard_v2
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: Debt guard
        run: ./scripts/debt-guard.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build binary
        run: go build -o tempus ./cmd/tempus

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # gosec runs inside golangci-lint (Lint job), which honors the repo's
      # //nolint:gosec directives; a standalone gosec CLI here would re-flag
      # those and uses different (#nosec) suppression semantics, so it's dropped.

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [lint, test, vet, architecture, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Full verify
        run: |
          make fmt-check
          make vet
          make arch
          make debt-guard
          go build ./...

  openapi-breaking:
    name: OpenAPI Breaking
    runs-on: ubuntu-latest
    # Pull requests only (a push has no base to compare against), and skipped
    # when the PR is explicitly labelled as an intended API break.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'api-breaking-ok')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest
      - name: Extract the base branch's spec
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git show "origin/$GITHUB_BASE_REF:internal/adapters/http/openapi.yaml" \
            > "$RUNNER_TEMP/base-openapi.yaml"
      - name: oasdiff breaking changes
        id: oasdiff
        run: |
          set -o pipefail
          # --flatten-allof is required, not cosmetic: the per-kind feature
          # schemas are allOf compositions, and without flattening oasdiff
          # compares the branches separately and downgrades every finding
          # inside them to a warning — which --fail-on ERR then ignores.
          oasdiff breaking "$RUNNER_TEMP/base-openapi.yaml" \
            internal/adapters/http/openapi.yaml \
            --flatten-allof --fail-on ERR 2>&1 | tee "$RUNNER_TEMP/oasdiff.log"
      - name: Report
        if: always()
        run: |
          {
            echo "## OpenAPI breaking-change check"
            echo
            if [ "${{ steps.oasdiff.outcome }}" = "success" ]; then
              echo "No breaking changes against \`$GITHUB_BASE_REF\`."
            else
              echo "Breaking change(s) against \`$GITHUB_BASE_REF\`. If the break"
              echo "is intended, label the PR \`api-breaking-ok\` and say why in"
              echo "the PR description."
            fi
            echo
            echo '```'
            cat "$RUNNER_TEMP/oasdiff.log" 2>/dev/null || echo "(no oasdiff output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
