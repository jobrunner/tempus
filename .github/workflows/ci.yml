name: CI

on:
  push:
    branches: [main, master, feat/**, fix/**, chore/**]
  pull_request:

permissions:
  contents: read

# Every job runs its steps in the flake's dev shell (.github/actions/nix-shell),
# the same tools `make verify` uses locally. Steps that are actions (checkout,
# the nix-shell action itself) are not affected.
defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git writes in this workflow, so the token has no business
          # staying in .git/config where PR code can read it (zizmor artipacked).
          persist-credentials: false
      - uses: ./.github/actions/nix-shell
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git writes in this workflow, so the token has no business
          # staying in .git/config where PR code can read it (zizmor artipacked).
          persist-credentials: false
      - uses: ./.github/actions/nix-shell
      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          go test -coverprofile=coverage/coverage.out -covermode=atomic ./...
          go tool cover -func=coverage/coverage.out
      - name: Coverage gate
        run: ./scripts/coverage-gate.sh coverage/coverage.out

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git writes in this workflow, so the token has no business
          # staying in .git/config where PR code can read it (zizmor artipacked).
          persist-credentials: false
      - uses: ./.github/actions/nix-shell
      - run: go vet ./...

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git writes in this workflow, so the token has no business
          # staying in .git/config where PR code can read it (zizmor artipacked).
          persist-credentials: false
      - uses: ./.github/actions/nix-shell
      - name: depguard + gomodguard
        run: golangci-lint run --enable-only depguard,gomodguard_v2 ./...
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: Debt guard
        run: ./scripts/debt-guard.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git writes in this workflow, so the token has no business
          # staying in .git/config where PR code can read it (zizmor artipacked).
          persist-credentials: false
      - uses: ./.github/actions/nix-shell
      - name: Build binary
        run: go build -o tempus ./cmd/tempus

  # On PRs and branch pushes a ratchet: only vulnerabilities the change adds
  # fail it, pre-existing ones are listed as a warning (scripts/vuln-gate.sh
  # explains why). On main it stays absolute — that is the alarm, and
  # vuln-scan.yml opens the fix PR.
  security:
    name: Security
    runs-on: ubuntu-latest
    env:
      ON_DEFAULT_BRANCH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git writes in this workflow, so the token has no business
          # staying in .git/config where PR code can read it (zizmor artipacked).
          persist-credentials: false

      # The baseline: the PR's base commit, or main for a branch push (this
      # workflow also runs on pushes to feat/**, fix/**, chore/**, and that
      # run reports the same required "Security" check). A nested module (own
      # go.mod), so the head's ./... skips it.
      - name: Check out base
        if: env.ON_DEFAULT_BRANCH != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base
          persist-credentials: false

      - uses: ./.github/actions/nix-shell
      - name: govulncheck
        env:
          BASE_DIR: ${{ env.ON_DEFAULT_BRANCH != 'true' && 'base' || '' }}
        run: scripts/vuln-gate.sh "$BASE_DIR"
      # gosec runs inside golangci-lint (Lint job), which honors the repo's
      # //nolint:gosec directives; a standalone gosec CLI here would re-flag
      # those and uses different (#nosec) suppression semantics, so it's dropped.

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [lint, test, vet, architecture, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git writes in this workflow, so the token has no business
          # staying in .git/config where PR code can read it (zizmor artipacked).
          persist-credentials: false
      - uses: ./.github/actions/nix-shell
      - name: Full verify
        run: |
          make fmt-check
          make vet
          make arch
          make debt-guard
          go build ./...
