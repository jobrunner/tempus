#
# zizmor policy for tempus. See https://docs.zizmor.sh/configuration/
#
# Pin policy: every `uses:` is pinned to a full commit SHA with the exact
# version as a trailing comment (`actions/checkout@<sha> # v7.0.1`).
# Dependabot updates both the SHA and the comment, so SHA-pinning costs no
# update automation. A tag is mutable — whoever controls the action repo can
# move it — and Dependabot PRs here are auto-merged (dependabot-auto-merge.yml),
# so a moved tag would reach main and the next release without a human look.
#
# unpinned-uses therefore runs with zizmor's default policy (hash-pin for
# everything). Do not reintroduce a `"*": ref-pin` wildcard: it turns the
# only high-severity audit this repo can trip into a no-op and the weekly
# gate can then never fail.
#
# artipacked is enabled too: every checkout sets `persist-credentials: false`.
# No workflow here needs the persisted token — the autofix job in
# vuln-scan.yml pushes with an explicit app token instead.

rules:
  # Dependabot cooldown would slow the weekly update cycle. Not justified at
  # v0.x, where staying current matters more than soaking new versions.
  dependabot-cooldown:
    disable: true
